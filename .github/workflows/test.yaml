name: Test
on:
  push:
  pull_request:
  schedule:
    - cron: '45 20 * * *'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable
      - name: configure Git to prefer GitHub over Wikimedia Gerrit to avoid rate limit errors (429)
        run: |
          cat >> ~/.gitconfig << 'EOF'

          [url "https://github.com/wikimedia/mediawiki-extensions-"]
          insteadOf = "https://gerrit.wikimedia.org/r/mediawiki/extensions/"

          [url "https://github.com/wikimedia/mediawiki-skins-"]
          insteadOf = "https://gerrit.wikimedia.org/r/mediawiki/skins/"

          [url "https://github.com/wikimedia/wikibase-termbox.git"]
          insteadOf = "https://gerrit.wikimedia.org/r/wikibase/termbox"
          EOF
      - uses: lucaswerkmeister/setup-mediawiki@v1
        id: setup-mediawiki
        with:
          extensions: |
            Wikibase
            WikibaseMediaInfo
            UniversalLanguageSelector # required by WikibaseMediaInfo
            WikibaseCirrusSearch # required by WikibaseMediaInfo
            CirrusSearch # required by WikibaseCirrusSearch
            Elastica # required by CirrusSearch
          local-settings: |
            $wgFileExtensions[] = 'pdf';
      - name: import test files
        env:
          MEDIAWIKI_INSTALL_DIR: ${{ steps.setup-mediawiki.outputs.install-directory }}
        run: |
          "$MEDIAWIKI_INSTALL_DIR/maintenance/run" importImages test/browser/files
      - run: npm install
      - run: make check
        env:
          MEDIAWIKI_USERNAME: ${{ steps.setup-mediawiki.outputs.admin-username }}
          MEDIAWIKI_PASSWORD: ${{ steps.setup-mediawiki.outputs.admin-password }}
          MEDIAWIKI_API_URL: ${{ steps.setup-mediawiki.outputs.api-url }}
          MEDIAWIKI_INDEX_URL: ${{ steps.setup-mediawiki.outputs.index-url }}
  latest-revision-tagged:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true
      - name: check that the latest revision on Wikimedia Commons corresponds to a Git tag
        run: |
          revid=$(
            curl -s -G \
              -A 'AC/DC CI (https://github.com/lucaswerkmeister/ACDC/)' \
              -d action=query \
              -d titles='MediaWiki:Gadget-ACDC.js' \
              -d prop=revisions \
              -d rvprop=ids \
              -d format=json \
              -d formatversion=2 \
              'https://commons.wikimedia.org/w/api.php' |
              jq -r '.query.pages[0].revisions[0].revid'
          )
          if ! git show-ref --quiet --tags "r$revid"; then
            printf >&2 'https://commons.wikimedia.org/w/index.php?diff=%s has no matching Git tag\n' "$revid"
            exit 1
          fi
